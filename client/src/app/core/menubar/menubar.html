<p-menubar [model]="items">
  <ng-template #item let-item let-root="root">
    <a pRipple class="flex items-center p-menubar-item-link" [routerLink]="item.routerLink">
      <i *ngIf="item.icon" [ngClass]="item.icon" style="font-size: 1.2rem; color: rgb(247,173,0);"></i>
      <span class="ml-2">{{ item.label }}</span>
      <span *ngIf="item.shortcut" class="ml-auto text-xs text-surface-400 dark:text-surface-500 border border-surface-200 dark:border-surface-700 rounded px-1 py-0.5">
        {{ item.shortcut }}
      </span>
      <p-badge
        *ngIf="item.badge"
        [value]="item.badge"
        [ngClass]="{ 'ml-auto': !root, 'ml-2': root }"
      />
    </a>
  </ng-template>
</p-menubar>

<router-outlet />
